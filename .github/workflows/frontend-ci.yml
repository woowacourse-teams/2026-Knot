name: Frontend CI

# PR마다 FE 단위·통합 테스트를 돌려요. E2E와 타입 검사·린트는 여기서 돌리지 않아요.
# - paths 필터를 걸지 않아요. 필수 검사로 등록하면 BE만 바꾼 PR에서는 검사가 아예 생기지 않아
#   「대기 중」으로 남고 병합이 막히기 때문이에요. 대신 변경 감지 job이 FE 변경이 없으면 검사를 건너뛰어요.
# - 필수 검사에는 마지막 job 「Frontend CI 결과」 하나만 등록하면 돼요.
on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

# 같은 PR에 새로 푸시하면 이전 실행은 의미가 없어 취소해요. develop은 커밋마다 결과를 남기려고 취소하지 않아요
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: 변경 감지
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}

    steps:
      # PR은 base와 PR을 합친 병합 커밋을 받아요. 첫 번째 부모가 base라서 2개 깊이면 비교할 수 있어요
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect frontend changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="HEAD^1"
          elif [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$' \
            && git fetch --no-tags --depth=1 origin "$PUSH_BEFORE" 2>/dev/null; then
            BASE="$PUSH_BEFORE"
          else
            # 비교할 이전 커밋을 알 수 없으면(새 브랜치, 강제 푸시 등) 놓치지 않도록 모두 검사해요
            echo "::notice::비교할 이전 커밋이 없어 모든 검사를 실행해요."
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE" HEAD)

          if echo "$CHANGED_FILES" | grep -qE '^(frontend/|\.github/workflows/frontend-ci\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: 단위·통합 테스트
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      files: ${{ steps.count.outputs.files }}
      total: ${{ steps.count.outputs.total }}
      passed: ${{ steps.count.outputs.passed }}
      failed: ${{ steps.count.outputs.failed }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 로그용 기본 출력과 요약에 쓸 테스트 수(JSON)를 함께 남겨요
      - name: Test
        run: pnpm test --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-report.json"

      # 테스트가 실패해도 몇 개가 실패했는지 요약에 남기려고 항상 실행해요
      - name: Count tests
        id: count
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const out = (key, value) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
            try {
              const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/vitest-report.json", "utf8"));
              out("files", report.testResults.length);
              out("total", report.numTotalTests);
              out("passed", report.numPassedTests);
              out("failed", report.numFailedTests);
            } catch {
              console.log("테스트 리포트가 없어 개수를 남기지 않아요.");
            }
          '

  result:
    # 필수 상태 검사에 이 이름 하나만 등록해요. 이름을 바꾸면 브랜치 보호 규칙도 같이 바꿔야 해요
    name: Frontend CI 결과
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Summarize and decide
        env:
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          TEST_FILES: ${{ needs.test.outputs.files }}
          TEST_TOTAL: ${{ needs.test.outputs.total }}
          TEST_PASSED: ${{ needs.test.outputs.passed }}
          TEST_FAILED: ${{ needs.test.outputs.failed }}
        run: |
          label() {
            case "$1" in
              success) echo "✅ 통과" ;;
              failure) echo "❌ 실패" ;;
              cancelled) echo "⏹️ 취소" ;;
              skipped) echo "⏭️ 건너뜀" ;;
              *) echo "$1" ;;
            esac
          }

          if [ -n "$TEST_TOTAL" ]; then
            TEST_DETAIL="${TEST_FILES}개 파일, ${TEST_TOTAL}개 중 ${TEST_PASSED}개 통과, ${TEST_FAILED}개 실패"
          else
            TEST_DETAIL="-"
          fi

          {
            echo "## Frontend CI 결과"
            echo
            if [ "$FRONTEND_CHANGED" = "false" ]; then
              echo "FE 변경이 없어 검사를 건너뛰었어요."
              echo
            fi
            echo "| 검사 | 결과 | 비고 |"
            echo "| --- | --- | --- |"
            echo "| 변경 감지 | $(label "$CHANGES") | FE 변경: ${FRONTEND_CHANGED:-알 수 없음} |"
            echo "| 단위·통합 테스트 | $(label "$TEST") | $TEST_DETAIL |"
          } >> "$GITHUB_STEP_SUMMARY"

          # 건너뛴 검사는 통과로 봐요. 하나라도 실패하거나 취소됐으면 이 job을 실패시켜요
          for result in "$CHANGES" "$TEST"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::실패하거나 취소된 검사가 있어요. 위 표에서 ❌·⏹️ 항목의 job 로그를 확인해 주세요."
              exit 1
            fi
          done
