name: Frontend Dev CD

on:
  push:
    branches:
      - develop
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-dev-deployment
  cancel-in-progress: true

env:
  API_BASE_URL: ${{ vars.API_BASE_URL_DEV }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API_BASE_URL
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::Repository variable API_BASE_URL_DEV is not set; the bundle will call the API with an undefined base URL."
          fi

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          packageManager: pnpm
          environment: dev
