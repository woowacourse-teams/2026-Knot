name: Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate-delivery-metadata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test governance validator
        run: python3 -m unittest discover .github/scripts -p 'test_*.py' -v

      - name: Validate pull request
        run: >-
          python3 .github/scripts/validate_governance.py
          --config .github/knot-conventions.yml
          --payload "$GITHUB_EVENT_PATH"
