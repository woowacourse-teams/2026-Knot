name: Backend Dev CD

on:
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-dev.yml"

permissions:
  contents: read

concurrency:
  group: backend-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build backend
        id: build
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean check bootJar

      - name: Select executable JAR
        id: jar
        shell: bash
        run: |
          set -Eeuo pipefail

          jar_path="$(find backend/build/libs \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-plain.jar' \
            -print -quit)"

          test -n "$jar_path"
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"

      - name: Upload JAR to NCP
        id: upload
        shell: bash
        env:
          NCP_DEV_HOST: ${{ secrets.NCP_DEV_HOST }}
          NCP_DEV_USER: ${{ secrets.NCP_DEV_USER }}
          NCP_DEV_SSH_PRIVATE_KEY: ${{ secrets.NCP_DEV_SSH_PRIVATE_KEY }}
          NCP_DEV_KNOWN_HOSTS: ${{ secrets.NCP_DEV_KNOWN_HOSTS }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
        run: |
          set -Eeuo pipefail

          : "${NCP_DEV_HOST:?NCP_DEV_HOST secret is required}"
          : "${NCP_DEV_USER:?NCP_DEV_USER secret is required}"
          : "${NCP_DEV_SSH_PRIVATE_KEY:?NCP_DEV_SSH_PRIVATE_KEY secret is required}"
          : "${NCP_DEV_KNOWN_HOSTS:?NCP_DEV_KNOWN_HOSTS secret is required}"

          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$NCP_DEV_SSH_PRIVATE_KEY" > "$HOME/.ssh/ncp-dev"
          printf '%s\n' "$NCP_DEV_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/ncp-dev"
          chmod 644 "$HOME/.ssh/known_hosts"

          scp \
            -i "$HOME/.ssh/ncp-dev" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$JAR_PATH" \
            "$NCP_DEV_USER@$NCP_DEV_HOST:/tmp/knot-backend-dev.jar"

      - name: Restart backend and verify health
        id: deploy
        shell: bash
        env:
          NCP_DEV_HOST: ${{ secrets.NCP_DEV_HOST }}
          NCP_DEV_USER: ${{ secrets.NCP_DEV_USER }}
          NCP_DEV_SSH_PRIVATE_KEY: ${{ secrets.NCP_DEV_SSH_PRIVATE_KEY }}
          NCP_DEV_KNOWN_HOSTS: ${{ secrets.NCP_DEV_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$NCP_DEV_SSH_PRIVATE_KEY" > "$HOME/.ssh/ncp-dev"
          printf '%s\n' "$NCP_DEV_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/ncp-dev"
          chmod 644 "$HOME/.ssh/known_hosts"

          ssh \
            -i "$HOME/.ssh/ncp-dev" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$NCP_DEV_USER@$NCP_DEV_HOST" \
            'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          sudo -n /usr/bin/install \
            -o knot \
            -g knot \
            -m 500 \
            /tmp/knot-backend-dev.jar \
            /opt/knot-backend/app.jar

          sudo -n /usr/bin/systemctl restart knot-backend.service
          sudo -n /usr/bin/systemctl is-active knot-backend.service

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 15 \
            http://127.0.0.1:8080/actuator/health

          rm -f /tmp/knot-backend-dev.jar
          REMOTE

      - name: Notify Discord
        if: always()
        continue-on-error: true
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEV_CD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          UPLOAD_STATUS: ${{ steps.upload.outcome }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_DEV_CD_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi

          stage_label() {
            case "$1" in
              success) echo "✅ 성공" ;;
              failure) echo "❌ 실패" ;;
              cancelled) echo "⏹️ 취소" ;;
              skipped) echo "⏭️ 건너뜀" ;;
              *) echo "⚪ $1" ;;
            esac
          }

          if [ "$JOB_STATUS" = "success" ]; then
            TITLE="✅ Backend Dev CD 성공"
            DESCRIPTION="develop 브랜치의 NCP 개발 서버 배포가 완료되었습니다."
            COLOR=5763719
            STATUS_LABEL="성공"
          else
            TITLE="❌ Backend Dev CD 실패"
            DESCRIPTION="develop 브랜치의 NCP 개발 서버 배포에 실패했습니다."
            COLOR=15548997
            STATUS_LABEL="실패"
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg status "$STATUS_LABEL" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg commit "${COMMIT_SHA::7}" \
            --arg build "$(stage_label "$BUILD_STATUS")" \
            --arg upload "$(stage_label "$UPLOAD_STATUS")" \
            --arg deploy "$(stage_label "$DEPLOY_STATUS")" \
            --arg run_url "$RUN_URL" \
            --argjson color "$COLOR" \
            '{
              username: "Knot GitHub",
              allowed_mentions: { parse: [] },
              embeds: [
                {
                  title: $title,
                  description: $description,
                  url: $run_url,
                  color: $color,
                  fields: [
                    { name: "상태", value: ("`" + $status + "`"), inline: true },
                    { name: "브랜치", value: ("`" + $branch + "`"), inline: true },
                    { name: "배포 대상", value: "`NCP Dev`", inline: true },
                    { name: "빌드", value: $build, inline: true },
                    { name: "JAR 전송", value: $upload, inline: true },
                    { name: "서비스 재시작", value: $deploy, inline: true },
                    { name: "커밋", value: ("`" + $commit + "`"), inline: true },
                    { name: "실행자", value: ("`" + $actor + "`"), inline: true },
                    { name: "상세 로그", value: ("[GitHub Actions 실행 보기](" + $run_url + ")"), inline: false }
                  ],
                  footer: { text: "Knot Backend Dev CD" }
                }
              ]
            }')

          curl --fail-with-body \
            --silent \
            --show-error \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
