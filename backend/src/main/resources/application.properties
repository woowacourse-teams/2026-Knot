spring.application.name=backend

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/knot}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# API documentation
knot.api-docs.enabled=false
springdoc.api-docs.enabled=${knot.api-docs.enabled}
springdoc.swagger-ui.enabled=${knot.api-docs.enabled}
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.validatorUrl=none
springdoc.swagger-ui.supportedSubmitMethods=
springdoc.swagger-ui.tryItOutEnabled=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.queryConfigEnabled=false

# OAuth
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user

# JWT
auth.jwt.secret=${JWT_SECRET:}
auth.jwt.expiration=PT1H
auth.jwt.nickname-token-expiration=PT10M
auth.jwt.issuer=${JWT_ISSUER:https://knoted.kr}
auth.jwt.audience=${JWT_AUDIENCE:knot-api}
auth.jwt.cookie-name=__Host-KNOT_ACCESS_TOKEN
auth.jwt.nickname-cookie-name=KNOT_NICKNAME_TOKEN
auth.jwt.refresh-cookie-name=__Host-KNOT_REFRESH_TOKEN
auth.jwt.secure=${JWT_COOKIE_SECURE:true}

# CORS
auth.cors.allowed-origins=${AUTH_CORS_ALLOWED_ORIGINS:${AUTH_CORS_ALLOWED_ORIGIN:https://knoted.kr}}

# Workspace invitation
workspace.invitation.lookup-hash-key=${WORKSPACE_INVITATION_LOOKUP_HASH_KEY:}

# OAuth login result
auth.oauth2.success-redirect-uri=${AUTH_SUCCESS_REDIRECT_URI:/api/v1/auth/me}
auth.oauth2.nickname-redirect-uri=${AUTH_NICKNAME_REDIRECT_URI:/onboarding}
auth.oauth2.failure-redirect-uri=${AUTH_FAILURE_REDIRECT_URI:/login?error=oauth2}

# Recording audio storage
recording.audio-storage.endpoint=${RECORDING_AUDIO_STORAGE_ENDPOINT:}
recording.audio-storage.region=${RECORDING_AUDIO_STORAGE_REGION:}
recording.audio-storage.bucket=${RECORDING_AUDIO_STORAGE_BUCKET:}
recording.audio-storage.access-key=${RECORDING_AUDIO_STORAGE_ACCESS_KEY:}
recording.audio-storage.secret-key=${RECORDING_AUDIO_STORAGE_SECRET_KEY:}
recording.audio-storage.upload-url-ttl=${RECORDING_AUDIO_STORAGE_UPLOAD_URL_TTL:PT15M}
recording.audio-storage.allowed-content-types=${RECORDING_AUDIO_ALLOWED_CONTENT_TYPES:audio/webm}
recording.audio-storage.max-content-length=${RECORDING_AUDIO_MAX_CONTENT_LENGTH:524288000}
