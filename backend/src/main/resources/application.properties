spring.application.name=backend

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/knot}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OAuth
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user

# JWT
auth.jwt.secret=${JWT_SECRET:}
auth.jwt.expiration=PT1H
auth.jwt.nickname-token-expiration=PT10M
auth.jwt.issuer=${JWT_ISSUER:https://knoted.kr}
auth.jwt.audience=${JWT_AUDIENCE:knot-api}
auth.jwt.cookie-name=__Host-KNOT_ACCESS_TOKEN
auth.jwt.nickname-cookie-name=KNOT_NICKNAME_TOKEN
auth.jwt.secure=${JWT_COOKIE_SECURE:true}

# OAuth login result
auth.oauth2.success-redirect-uri=${AUTH_SUCCESS_REDIRECT_URI:/auth/me}
auth.oauth2.nickname-redirect-uri=${AUTH_NICKNAME_REDIRECT_URI:/nickname}
auth.oauth2.failure-redirect-uri=${AUTH_FAILURE_REDIRECT_URI:/login?error=oauth2}
