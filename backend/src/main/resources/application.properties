spring.application.name=backend

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/knot}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# API documentation
knot.api-docs.enabled=false
springdoc.api-docs.enabled=${knot.api-docs.enabled}
springdoc.swagger-ui.enabled=${knot.api-docs.enabled}
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.validatorUrl=none
springdoc.swagger-ui.supportedSubmitMethods=
springdoc.swagger-ui.tryItOutEnabled=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.queryConfigEnabled=false

# OAuth
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user

# JWT
auth.jwt.secret=${JWT_SECRET:}
auth.jwt.expiration=PT1H
auth.jwt.nickname-token-expiration=PT10M
auth.jwt.issuer=${JWT_ISSUER:https://knoted.kr}
auth.jwt.audience=${JWT_AUDIENCE:knot-api}
auth.jwt.cookie-name=__Host-KNOT_ACCESS_TOKEN
auth.jwt.nickname-cookie-name=KNOT_NICKNAME_TOKEN
auth.jwt.secure=${JWT_COOKIE_SECURE:true}

# CORS
auth.cors.allowed-origin=${AUTH_CORS_ALLOWED_ORIGIN:https://knoted.kr}

# Workspace invitation
workspace.invitation.lookup-hash-key=${WORKSPACE_INVITATION_LOOKUP_HASH_KEY:}
workspace.invitation.encryption-key=${WORKSPACE_INVITATION_ENCRYPTION_KEY:}

# Notion OAuth
notion.oauth.enabled=${NOTION_OAUTH_ENABLED:false}
notion.oauth.client-id=${NOTION_OAUTH_CLIENT_ID:}
notion.oauth.client-secret=${NOTION_OAUTH_CLIENT_SECRET:}
notion.oauth.authorization-uri=${NOTION_OAUTH_AUTHORIZATION_URI:https://api.notion.com/v1/oauth/authorize}
notion.oauth.token-uri=${NOTION_OAUTH_TOKEN_URI:https://api.notion.com/v1/oauth/token}
notion.oauth.api-version=${NOTION_API_VERSION:2026-03-11}
notion.oauth.callback-uri=${NOTION_OAUTH_CALLBACK_URI:}
notion.oauth.redirect-base-uri=${NOTION_OAUTH_REDIRECT_BASE_URI:https://knoted.kr}
notion.oauth.state-ttl=PT10M
notion.oauth.request-timeout=PT5S
notion.oauth.active-encryption-key-version=${NOTION_OAUTH_ACTIVE_ENCRYPTION_KEY_VERSION:v1}
notion.oauth.state-hash-key=${NOTION_OAUTH_STATE_HASH_KEY:}
notion.oauth.encryption-keys.v1=${NOTION_OAUTH_ENCRYPTION_KEY_V1:}

# Notion Import worker
notion.import.worker.enabled=${NOTION_IMPORT_WORKER_ENABLED:true}
notion.import.worker.poll-delay=${NOTION_IMPORT_WORKER_POLL_DELAY:PT1S}
notion.import.worker.heartbeat-interval=${NOTION_IMPORT_HEARTBEAT_INTERVAL:PT30S}
notion.import.worker.running-stale-timeout=${NOTION_IMPORT_RUNNING_STALE_TIMEOUT:PT1H}
notion.import.worker.recovery-batch-size=${NOTION_IMPORT_RECOVERY_BATCH_SIZE:100}

# OAuth login result
auth.oauth2.success-redirect-uri=${AUTH_SUCCESS_REDIRECT_URI:/api/v1/auth/me}
auth.oauth2.nickname-redirect-uri=${AUTH_NICKNAME_REDIRECT_URI:/onboarding}
auth.oauth2.failure-redirect-uri=${AUTH_FAILURE_REDIRECT_URI:/login?error=oauth2}
