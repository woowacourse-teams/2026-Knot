apiVersion: 1
datasources:
  - name: Knot Prometheus
    uid: knot-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
  - name: Knot Loki
    uid: knot-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
