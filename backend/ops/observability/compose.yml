name: knot-observability

services:
  prometheus:
    image: prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=8GB
      - --web.enable-remote-write-receiver
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  loki:
    image: grafana/loki@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    command: -config.file=/etc/loki/loki.yml
    ports:
      - 127.0.0.1:3100:3100
    volumes:
      - ./config/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    logging: *bounded-logs

  blackbox:
    image: prom/blackbox-exporter@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./config/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    logging: *bounded-logs

  grafana:
    image: grafana/grafana@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5
    ports:
      - 127.0.0.1:3000:3000
    env_file:
      - ./secrets/discord.env
    environment:
      GF_SECURITY_ADMIN_USER: knot-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-Knot-Viewer
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: 172.18.0.1
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:33000
    volumes:
      - ./secrets/grafana-admin-password:/run/secrets/grafana-admin-password:ro
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    logging: *bounded-logs

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
