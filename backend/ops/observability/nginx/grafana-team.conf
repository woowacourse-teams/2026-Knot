map $http_upgrade $knot_grafana_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name grafana.knoted.kr;

    return 301 https://grafana.knoted.kr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grafana.knoted.kr;

    ssl_certificate /etc/nginx/ssl/grafana-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/grafana-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/knot-grafana-cloudflare-allow.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "private, no-store" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host grafana.knoted.kr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host grafana.knoted.kr;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Knot-Viewer "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $knot_grafana_connection_upgrade;
        proxy_read_timeout 90s;
        proxy_redirect off;
    }
}
