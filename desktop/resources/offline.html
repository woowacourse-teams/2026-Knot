<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Knot — 연결할 수 없음</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
        background: #ffffff;
        color: #1a1a1a;
      }
      main {
        max-width: 26rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 0.5rem;
        line-height: 1.6;
        color: #555555;
        font-size: 0.9rem;
      }
      kbd {
        border: 1px solid #d4d4d4;
        border-radius: 0.25rem;
        padding: 0.1rem 0.35rem;
        font-size: 0.8rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1a1a1a;
          color: #f5f5f5;
        }
        p {
          color: #b0b0b0;
        }
        kbd {
          border-color: #444444;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Knot에 연결할 수 없습니다</h1>
      <p>네트워크 연결을 확인한 뒤 다시 시도해 주세요.</p>
      <p>메뉴의 <strong>파일 → Knot 다시 열기</strong>(<kbd>⌘⇧R</kbd>)를 누르면 다시 연결합니다.</p>
    </main>
  </body>
</html>
