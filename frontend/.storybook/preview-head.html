<!-- 앱의 index.html과 같은 글꼴을 불러와요 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link
  rel="stylesheet"
  as="style"
  crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
/>

<!--
  문서 페이지 안에 따로 그려지는 스토리 화면(docs.story.inline: false)은 개발 서버의 실시간 갱신 연결을 열지 않아요.
  화면마다 연결을 하나씩 잡고 있어서, 한 문서 페이지에 따로 그리는 스토리가 5개쯤 되면 브라우저의 연결 수가 모자라 스토리가 뜨지 않아요.
  그래서 이 화면들은 파일을 저장해도 스스로 다시 그리지 않고, 문서 페이지를 새로고침하면 바뀌어요.
-->
<script>
  try {
    // 부모가 스토리북의 미리보기 화면(iframe.html)이면 문서 페이지 안에 따로 그려진 스토리예요
    if (
      window.parent !== window &&
      /\/iframe\.html$/.test(window.parent.location.pathname)
    ) {
      window.EventSource = undefined;
    }
  } catch {
    // 다른 사이트에 끼워 넣어진 화면은 부모의 주소를 읽을 수 없어요. 그때는 아무것도 바꾸지 않아요
  }
</script>
